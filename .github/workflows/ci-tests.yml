name: CI - Selenium Tests

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: Frontend/frontend
        run: npm ci

      - name: Restore and build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Prepare ChromeDriver
        shell: pwsh
        run: |
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          $chromeVersion = (Get-Item $chromePath).VersionInfo.FileVersion
          Write-Host "Chrome detected: $chromeVersion"
          $env:CHROMEDRIVER_VERSION = $chromeVersion
          "CHROMEDRIVER_VERSION=$chromeVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # extract to FitnessApp.Tests\tools\chromedriver\{version}\ so zip creates chromedriver-win64\ inside
          $extractDest = Join-Path $PWD "FitnessApp.Tests\tools\chromedriver\$chromeVersion"
          New-Item -ItemType Directory -Force -Path $extractDest | Out-Null
          $url = "https://storage.googleapis.com/chrome-for-testing-public/$chromeVersion/win64/chromedriver-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile chromedriver.zip
          Expand-Archive chromedriver.zip -DestinationPath $extractDest -Force
          Remove-Item chromedriver.zip -Force

      - name: Configure database and apply migrations
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          $connStr = "Server=(localdb)\MSSQLLocalDB;Database=Fitness;Trusted_Connection=True;TrustServerCertificate=True"
          # set for current step so dotnet-ef can use it immediately
          $env:ConnectionStrings__DefaultConnection = $connStr
          # set for subsequent steps (backend run)
          "ConnectionStrings__DefaultConnection=$connStr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          dotnet tool update --global dotnet-ef --version 9.*
          $ef = Join-Path $env:USERPROFILE '.dotnet\tools\dotnet-ef.exe'
          & $ef database update --project Fitness.csproj --startup-project Fitness.csproj

      - name: Start backend
        shell: pwsh
        run: |
          $proc = Start-Process dotnet -ArgumentList @('run', '--project', 'Fitness.csproj', '--launch-profile', 'https') -PassThru -RedirectStandardOutput backend.log -RedirectStandardError backend.err
          $ready = $false
          for ($i = 0; $i -lt 180; $i++) {
            if ($proc.HasExited) { Get-Content backend.err -ErrorAction SilentlyContinue; exit 1 }
            try {
              $r = Invoke-WebRequest -Uri https://localhost:7103/swagger -UseBasicParsing -SkipCertificateCheck -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ready = $true; Write-Host "Backend ready."; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { Get-Content backend.err -ErrorAction SilentlyContinue; exit 1 }

      - name: Build frontend
        working-directory: Frontend/frontend
        shell: pwsh
        run: npm run build

      - name: Start frontend preview
        shell: pwsh
        working-directory: Frontend/frontend
        run: |
          $frontendDir = (Get-Location).Path
          $proc = Start-Process npm.cmd `
            -ArgumentList @('run', 'preview', '--', '--port', '5173', '--host', 'localhost') `
            -WorkingDirectory $frontendDir `
            -PassThru `
            -RedirectStandardOutput "$frontendDir\frontend.log" `
            -RedirectStandardError "$frontendDir\frontend.err"
          for ($i = 0; $i -lt 30; $i++) {
            if ($proc.HasExited) {
              Write-Host "Frontend exited early (code $($proc.ExitCode)):"
              Get-Content "$frontendDir\frontend.err" -ErrorAction SilentlyContinue
              exit 1
            }
            try {
              $null = Invoke-WebRequest -Uri http://localhost:5173/ -UseBasicParsing -TimeoutSec 2
              Write-Host "Frontend ready after $i seconds."
              break
            } catch {
              if ($i -eq 29) { Get-Content "$frontendDir\frontend.err" -ErrorAction SilentlyContinue; exit 1 }
              Start-Sleep -Seconds 1
            }
          }

      - name: Seed test admin user
        shell: pwsh
        continue-on-error: true
        run: |
          $body = @{
            email = "admin1@gmail.com"; password = "Admin12."; userName = "admin1"
            name = "Admin"; surname = "User"; birthday = "1990-01-01"
            gender = "Male"; role = "Admin"
          } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "https://localhost:7103/api/auth/register" -Method Post -Body $body -ContentType "application/json" -SkipCertificateCheck
            Write-Host "Admin user created."
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
            Write-Host $(if ($code -eq 400) { "Admin already exists (OK)." } else { "Warning: $($_.Exception.Message)" })
          }

      - name: Run automated tests
        shell: pwsh
        run: |
          dotnet test FitnessApp.Tests/FitnessApp.Tests.csproj `
            --configuration Release `
            --no-build `
            --filter "FullyQualifiedName~FitnessApp.Tests.PageLoadTests|FullyQualifiedName~FitnessApp.Tests.AdminDashboardTest" `
            --logger "trx;LogFileName=test-results.trx" `
            --logger "html;LogFileName=test-results.html" `
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            backend.log
            backend.err
            Frontend/frontend/frontend.log
            Frontend/frontend/frontend.err
