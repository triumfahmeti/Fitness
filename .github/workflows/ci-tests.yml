name: CI - Selenium Tests

on:
  push:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: Frontend/frontend
        run: npm ci

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Prepare ChromeDriver
        shell: pwsh
        env:
          DRIVER_VERSION: "148.0.7778.168"
        run: |
          $version = $env:DRIVER_VERSION
          $dest = Join-Path -Path $PWD -ChildPath "tools\chromedriver\$version\chromedriver-win64"
          Write-Host "Creating $dest"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $url = "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/$version/win64/chromedriver-win64.zip"
          Write-Host "Downloading Chromedriver from $url"
          Invoke-WebRequest -Uri $url -OutFile chromedriver.zip
          Expand-Archive chromedriver.zip -DestinationPath $dest -Force
          Remove-Item chromedriver.zip -Force

      - name: Start frontend and run test
        shell: pwsh
        working-directory: Frontend/frontend
        run: |
          $server = Start-Process -FilePath npm.cmd -ArgumentList @('run','dev','--','--host','localhost','--strictPort','--port','5173') -PassThru -RedirectStandardOutput frontend.log -RedirectStandardError frontend.err
          Set-Content -Path frontend-pid.txt -Value $server.Id

          $timeout = 120
          $started = $false
          for ($i = 0; $i -lt $timeout; $i++) {
            if ($server.HasExited) {
              Write-Host 'Frontend process exited early.'
              Get-Content frontend.err -ErrorAction SilentlyContinue | Write-Host
              Set-Content -Path test-exit-code.txt -Value 1
              exit 1
            }

            try {
              $r = Invoke-WebRequest -Uri http://localhost:5173 -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                $started = $true
                break
              }
            } catch {
            }

            Start-Sleep -Seconds 1
          }

          if (-not $started) {
            Write-Host 'Frontend did not become available on http://localhost:5173'
            Get-Content frontend.err -ErrorAction SilentlyContinue | Write-Host
            Set-Content -Path test-exit-code.txt -Value 1
            exit 1
          }

          Write-Host 'Frontend started successfully.'
          try {
            $r = Invoke-WebRequest -Uri http://localhost:5173 -UseBasicParsing -TimeoutSec 5
            Write-Host "Frontend status: localhost=$($r.StatusCode)"
          } catch {
            Write-Host "Frontend pre-test check failed: $($_.Exception.Message)"
            Set-Content -Path test-exit-code.txt -Value 1
            exit 1
          }

          Pop-Location
          dotnet test FitnessApp.Tests/FitnessApp.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName=FitnessApp.Tests.AdminDashboardTest.TestAdminDashboardAccess" --logger "trx;LogFileName=test-results.trx"
          $testExit = $LASTEXITCODE
          Write-Host "DOTNET_TEST_EXIT_CODE=$testExit"
          Set-Content -Path test-exit-code.txt -Value $testExit

          try {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          } catch {
          }
        continue-on-error: true

      - name: Collect diagnostics
        shell: pwsh
        run: |
          Write-Host "Listing chromedriver folders"
          $driverRoot = Join-Path $PWD 'tools\chromedriver'
          if (Test-Path $driverRoot) { Get-ChildItem -Recurse $driverRoot | Out-File chromedriver-listing.txt } else { 'No chromedriver folder' | Out-File chromedriver-listing.txt }
          if (Test-Path Frontend/frontend/frontend.log) { Copy-Item Frontend/frontend/frontend.log frontend.log -Force }
          if (Test-Path Frontend/frontend/frontend.err) { Copy-Item Frontend/frontend/frontend.err frontend.err -Force }
          if (Test-Path Frontend/frontend/frontend-pid.txt) { Copy-Item Frontend/frontend/frontend-pid.txt frontend-pid.txt -Force }
          Get-ChildItem -Path '**/*.trx' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } | Out-File trx-paths.txt

      - name: Upload diagnostics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            **/test-results.trx
            test-exit-code.txt
            chromedriver-listing.txt
            frontend.log
            frontend.err
            frontend-pid.txt
            trx-paths.txt

      - name: Fail job on test failure
        shell: pwsh
        run: |
          if (Test-Path test-exit-code.txt) {
            $code = [int](Get-Content test-exit-code.txt)
            if ($code -ne 0) { Write-Host "Failing job with exit code $code"; exit $code }
          } else {
            Write-Host "No test-exit-code.txt found, assuming failure"; exit 1
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
