name: CI Tests

on:
  push:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Restore
        run: dotnet restore "FitnessApp.Tests/FitnessApp.Tests.csproj"

      - name: Build backend
        run: dotnet build "Fitness.csproj" --configuration Release --no-restore

      - name: Install frontend dependencies
        working-directory: Frontend/frontend
        run: npm ci

      - name: Start backend
        shell: pwsh
        run: |
          $env:ASPNETCORE_URLS = "https://localhost:7103"
          Start-Process -FilePath "dotnet" -ArgumentList 'run --project "Fitness.csproj" --configuration Release --no-build' -NoNewWindow

      - name: Start frontend
        shell: pwsh
        run: |
          Start-Process -FilePath "npm" -ArgumentList 'run dev -- --host 127.0.0.1 --port 5173' -WorkingDirectory "Frontend/frontend" -NoNewWindow

      - name: Wait for services
        run: npx --yes wait-on --timeout 600000 --strictSSL false https://localhost:7103 http://localhost:5173

      - name: Run tests
        run: >
          dotnet test "FitnessApp.Tests/FitnessApp.Tests.csproj"
          --filter "FullyQualifiedName~FitnessApp.Tests.AdminDashboardTest"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "TestResults"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: test-results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload test report (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: TestResults/**/*.trx
