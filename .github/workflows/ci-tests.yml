name: CI Tests

on:
  push:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: windows-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=(localdb)\\MSSQLLocalDB;Database=Fitness;Trusted_Connection=True;MultipleActiveResultSets=true;TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Restore
        run: dotnet restore "Fitness.sln"

      - name: Build backend
        run: dotnet build "Fitness.csproj" --configuration Release --no-restore

      - name: Ensure LocalDB is running
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB

      - name: Install frontend dependencies
        working-directory: Frontend/frontend
        run: npm ci

      - name: Start backend
        shell: pwsh
        run: |
          $env:ASPNETCORE_URLS = "http://localhost:7103"

          $outLog = Join-Path $env:RUNNER_TEMP "backend.out.log"
          $errLog = Join-Path $env:RUNNER_TEMP "backend.err.log"

          Write-Host "Backend logs:"
          Write-Host $outLog
          Write-Host $errLog

          Start-Process `
            -FilePath "dotnet" `
            -ArgumentList 'run --project "Fitness.csproj" --configuration Release --no-build --no-launch-profile' `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -NoNewWindow

      - name: Start frontend
        shell: pwsh
        run: |
          Start-Process `
            -FilePath "npm" `
            -ArgumentList 'run dev -- --host 0.0.0.0 --port 5173' `
            -WorkingDirectory "Frontend/frontend" `
            -NoNewWindow

      # - name: Wait for services
      #   run: npx --yes wait-on tcp:7103 tcp:5173 --timeout 60000
      - name: Wait a bit for services
    shell: pwsh
    run: Start-Sleep -Seconds 15

      - name: Run tests
        shell: pwsh
        run: |
          $maxAttempts = 3

          for ($i = 1; $i -le $maxAttempts; $i++) {

            Write-Host "Test attempt $i of $maxAttempts"

            dotnet test "FitnessApp.Tests/FitnessApp.Tests.csproj" `
              --filter "FullyQualifiedName~FitnessApp.Tests.AdminDashboardTest" `
              --logger "trx;LogFileName=test-results.trx" `
              --results-directory "TestResults"

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($i -lt $maxAttempts) {
              Write-Host "Tests failed. Retrying in 10 seconds..."
              Start-Sleep -Seconds 10
            }
          }

          exit 1

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: test-results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            ${{ runner.temp }}/backend.out.log
            ${{ runner.temp }}/backend.err.log

      - name: Upload test report (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: TestResults/**/*.trx
