name: CI Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore "FitnessApp.Tests/FitnessApp.Tests.csproj"

      - name: Run tests
        run: >
          dotnet test "FitnessApp.Tests/FitnessApp.Tests.csproj"
          --filter "FullyQualifiedName~FitnessApp.Tests.AdminDashboardTest"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "TestResults"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: test-results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload test report (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: TestResults/**/*.trx
