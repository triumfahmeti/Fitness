name: CI - Selenium Tests

on:
  push:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: Frontend/frontend
        run: npm ci

      - name: Start frontend dev server
        shell: pwsh
        working-directory: Frontend/frontend
        run: |
          Start-Process -FilePath npm -ArgumentList 'run','dev' -NoNewWindow
          $timeout = 120
          $i = 0
          while ($i -lt $timeout) {
            try {
              $r = Invoke-WebRequest -Uri http://localhost:5173 -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host 'Frontend started' ; break }
            } catch {
            }
            Start-Sleep -Seconds 1
            $i++
          }
          if ($i -ge $timeout) { Write-Error 'Frontend did not become available on http://localhost:5173' ; exit 1 }

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Prepare ChromeDriver
        shell: pwsh
        env:
          DRIVER_VERSION: "148.0.7778.168"
        run: |
          $version = $env:DRIVER_VERSION
          $dest = Join-Path -Path $PWD -ChildPath "tools\chromedriver\$version\chromedriver-win64"
          Write-Host "Creating $dest"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $url = "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/$version/win64/chromedriver-win64.zip"
          Write-Host "Downloading Chromedriver from $url"
          Invoke-WebRequest -Uri $url -OutFile chromedriver.zip
          Expand-Archive chromedriver.zip -DestinationPath $dest -Force
          Remove-Item chromedriver.zip -Force

      - name: Run only AdminDashboard test
        run: dotnet test FitnessApp.Tests/FitnessApp.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName=FitnessApp.Tests.AdminDashboardTest.TestAdminDashboardAccess" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
